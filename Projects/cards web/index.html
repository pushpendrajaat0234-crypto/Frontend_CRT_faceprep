<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
        }
        .container{
            width: 100vw;
            height: 100vh;
            border: 2px black solid;
            background: #EEAECA;
            background: radial-gradient(circle, rgba(238, 174, 202, 1) 0%, rgba(148, 187, 233, 1) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box{
            width: 300px;
            height: 450px;
            border-radius: 20px;
            background-color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            /* padding: 4px; */
        }
        .box p{
            margin: 5px;
        }

    </style>

</head>
<body>
    <div class="container">
        <div class="box">
            <img src="Qrcode.svg" alt="Qrcode">
            <h2>This is our card</h2>
            <p>I have nothing to say but i just ask it bacause i love to make this website</p>
        </div>
    </div>
</body>
</html>
