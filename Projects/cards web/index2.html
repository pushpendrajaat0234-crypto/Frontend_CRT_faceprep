<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Second Card</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            overflow: hidden;
        }
        .section{
            width: 100vw;
            height: 100vh;
            background: #EEAECA;
            background: radial-gradient(circle, rgba(238, 174, 202, 1) 0%, rgba(148, 187, 233, 1) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box{
            width: 300px;
            height: 500px;
            background-color: white;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .textbox{
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding-inline: 20px;
        }
        #smallbox{
            width: 90%;
            height: 10%;
            display: flex;
            padding-inline: 10px;
            justify-content: space-between;
            align-items: center;
            background-color: #EEAECA;
            border-radius: 10px;
        }
        #PaymentButtom{
            width: 90%;
            height: 9%;
            background-color: rgb(115, 68, 159);
            border-radius: 10px;
            color: white;
            box-shadow: 5px 5px 5px rgba(0, 0, 0, 0.352);
        }
        .cancelbox a{
            text-decoration: none;
            color: rgb(66, 63, 63);
            font-weight: bold;
        }
        #part{
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #part img{
            width: 25px;
            height: 25px;
            
        }
       
    </style>
</head>
<body>
    <div class="section">
        <div class="box">
            <img src="mikasha.jpg" alt="mikasha">
            <div class="textbox">
             <h2>Order Summary</h2>
            <p>Lorem, ipsum dolor sit amet Vitae nam sunt inventore excepturi vero aperiam, magnam rerum!</p>
            </div>
            
             <div id="smallbox">
                <div id="part">
                    <img src="OIP.webp" alt="icon">
                    <div class="plane">
                        <p>Annual Plane</p>
                        <p>$99.9/year</p>
                    </div>
                        
                    
                </div>
                <a href="#">change</a>
             </div>

             <button id="PaymentButtom">Proceed to Payment</button>

             <div class="cancelbox">
                <a href="#">Cancel Order</a>
             </div>
        </div>
    </div>
</body>
</html>
