<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root{
            --custom-color: rgb(70, 11, 11);
        }
        .container{
            background-color: beige;
            height: 600px;
            border: 2px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box{
            --random-width: 300px;
            background-color: rgb(75, 147, 150);
            height: var(--random-width);
            width: var(--random-width);
            border: 1px solid black;
            margin: 2px; padding: 2px;
            overflow: auto;
            box-shadow: -10px 5px 5px rgb(160, 36, 36);
            /* box-shadow: -10px 5px 5px -5px rgb(160, 36, 36); */
            /* box-shadow: inset -10px 5px 5px rgb(160, 36, 36); */
            /* box-shadow: 10px 5px red, 15px 7px blueviolet; */

        }
        h2{
            /* text-shadow: -5px 7px 1px rgb(207, 220, 107); */
            text-shadow: -5px 7px 1px rgb(207, 220, 107), -6px 8px 1px rgb(133, 51, 51), -7px 9px 1px rgb(51, 51, 172);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <img src="genious image1.avif" alt="image1" width="100px">
            <h2>I am a Genious</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Repellendus pariatur praesentium eos minima debitis quo excepturi suscipit perferendis saepe animi?</p>

        </div>
    </div>
</body>
</html>
