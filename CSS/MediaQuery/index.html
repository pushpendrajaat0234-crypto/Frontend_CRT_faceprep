         .container{
            background-color: blanchedalmond;
            border: 3px solid black;
            height: 500px;
            overflow: auto;
            display: flex;
         }
         .box{
            width: 200px;
            height: 200px;
            border: 1px solid black;
            margin: 3px;
         }
         #box1{
            background-color: rgb(210, 97, 32);
         }
         #box2{
            background-color: rgb(174, 127, 26);
         }
         #box3{
            background-color: rgb(182, 75, 180);
         }
         @media (min-width: 640px){
            .container{
                flex-direction: row;
            }
         }
         @media (max-width: 640px){
            .container{
                flex-direction: column;
            }
         }
         
    </style>

        <div class="box" id="box1">1</div>
        <div class="box" id="box2">2</div>
        <div class="box" id="box3">3</div>
    </div>
