<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animations Knowledge</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            
        }
        .container{
            width: 100vw;
            height: 100vh;
            background-color: beige;
            border: 2px solid black;
            position: relative;
            /* margin: 3px; */
            overflow: hidden;
        }
        .box{
            width: 300px;
            height: 100px;
            border: 1px solid black;
            background-color: rgb(53, 123, 185);
            border-radius: 4px;
            margin: 3px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            animation-name: rightMovement;
            animation-duration: 3s;
            animation-iteration-count: infinite;
            /* animation-delay: 1s; */
            /* animation-timing-function:cubic-bezier(0.92, -0.55, 1, 1); */
            animation-timing-function: linear;
            animation-direction: alternate;
            animation-fill-mode: both;

            
        }
        p{
            color: rgb(223, 197, 25);
            text-shadow: 1px 1px 1px red;
        }
        @keyframes rightMovement {
            from{
                top: 0;
                left: 0;
                box-shadow: 7px 4px 4px;
            }
            to{
                top: 0;
                left: 688.8px;
                box-shadow: -7px 4px 4px;
            }
        }
        .bottom-box{
            width: 300px;
            height: 100px;
            border: 1px solid black;
            background-color: rgb(53, 123, 185);
            border-radius: 4px;
            margin: 3px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            
            animation-name: back;
            animation-duration: 3s;
            animation-iteration-count: infinite;
            /* animation-delay: 1s; */
            /* animation-timing-function:cubic-bezier(0.92, -0.55, 1, 1); */
            animation-timing-function: linear;
            animation-direction: alternate-reverse;
            animation-fill-mode: both;
        }
        @keyframes back {
            from{
                top: 300px;
                left: 0;
                box-shadow: 7px 4px 4px;
            }
            to{
                top: 300px;
                left: 688.8px;
                box-shadow: -7px 4px 4px;
            }
        }
        #circle{
            width: 50px;
            height: 50px;
            border: 1px solid black;
            background-color: rgb(53, 123, 185);
            border-radius: 50%;
            align-self: center;
            position: absolute;
           
            animation-name: circleMovement;
            animation-duration: 5s;
            animation-iteration-count: infinite;
            /* animation-delay: 1s; */
            /* animation-timing-function:cubic-bezier(0.92, -0.55, 1, 1); */
            animation-timing-function: linear;
           animation-direction: alternate;
            animation-fill-mode: both;
            
        }
        @keyframes circleMovement {
            0%{
                top: 0%;
                left: 0%;
            }
            30%{
                top: 0%;
                left: 80%;
            }
            60%{
                top: 80%;
                left: 0%;
            }
            100%{
                top: 80%;
                left: 80%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
         <div class="box">
            <p>I am a Top Box</p>
         </div>
         <div class="bottom-box">
            <p>I am a Bottom Box</p>
         </div>
         <div id="circle">
             
         </div>
    </div>
</body>
</html>
