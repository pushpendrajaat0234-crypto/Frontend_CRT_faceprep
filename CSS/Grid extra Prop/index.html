<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Grid Design</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .container{
            width: 100vw;
            height: 100vh;
            display: grid;
            /* grid-template-rows: repeat(4, 1fr);
            grid-template-columns: repeat(4, 1fr); */

            grid-template-columns: repeat(auto-fit, minmax(200px, 500px));
            gap: 1rem;
            background-color: rgb(117, 112, 112);
            padding: 4rem;
            justify-content: center;
        }
        .items{
            border: 3px solid black;
            background-color: beige;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="items">A</div>
        <div class="items">B</div>
        <div class="items">C</div>
        <div class="items">D</div>
        <div class="items">E</div>
        <div class="items">F</div>
        <div class="items">G</div>
        <div class="items">H</div>
        <div class="items">I</div>
        <div class="items">J</div>
        <div class="items">K</div>
        <div class="items">L</div>
        <div class="items">M</div>
        <div class="items">N</div>
        <div class="items">O</div>
        <div class="items">P</div>
    </div>
</body>
</html>
