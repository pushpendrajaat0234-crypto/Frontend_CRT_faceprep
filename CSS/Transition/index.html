<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
    <style>
        .box{
            width: 400px;
            height: 400px;
            background-color: beige;
            border: 2px solid black;
            /* transition-property: all;
            transition-duration: 3s;
            transition-timing-function: linear; */

            transition: all 3s linear;
        }
        .box:hover{
            width: 1000px;
            background-color: rgb(75, 46, 142);
            color: yellow;
        }
        .box{
            font-size: 25px;
            color: rgb(35, 72, 104);
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="box">
       
            I am still a Genious
        
    </div>
</body>
</html>
