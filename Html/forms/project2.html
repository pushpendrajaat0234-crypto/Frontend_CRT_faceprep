<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form2</title>
</head>
<body>
    <h1>Job Application</h1>

    <form>
        <label for="name">Name:</label>
        <br/>
        <br/>
        <input type="text" id="name">
        <br/>
        <label for="email">Email:</label>
        <br/>
        <br/>
        <input type="text" id="email">
        <br/>
        <label for="phone">Phone:</label>
        <br/>
        <br/>
        <input type="tel" name="phone" id="phone">
        <br/>
        <br/>
        <label for="resume">Resume:</label>
        
        <input type="file" name="resume" id="resume">
        <br/>
        <br/>
        <label for="counter">Experiance(in Years)</label>
        
        <input type="number" name="counter" id="counter" min="0" max="50">
    
        <fieldset>
            <legend>Skills</legend>
        <br/>
        <input type="checkbox" name="html" id="html">
        <br/>
        <label for="html">HTML</label>
        <br/>
        <br/>
        <input type="checkbox" name="css" id="css">
        <br/>
        <label for="css">CSS</label>
        <br/>
        <br/>
        <input type="checkbox" name="javascript" id="javascript">
        <br/>
        <label for="javascript">javaScript</label>
        </fieldset>
        <label for="education">Highest Education</label>
        <br/>
        <br/>
        <select name="education" id="education">
            <option value="highschool">High School</option>
            <option value="associate degree">Associate's Degree</option>
            <option value="bacholar degree">Bacholar's Degree</option>
            <option value="phd">PHD</option>
        </select>
        <fieldset>
            <legend>Availability:</legend>
            
            <input type="radio" name="sutaibletime" id="fulltime">
            <br/>
            
            <label for="fulltime">Full-time</label>
           <br/>
           <br/>
            <input type="radio" name="sutaibletime" id="parttime">
            <br/>
             <label for="parttime">Part-time</label>
        </fieldset>
         <br/>
         <br/>
        <label for="comment"> Additional Comments:</label>
        <br/>
        <textarea name="comment" id="comment" rows="5" cols="50"></textarea>

        <button>Submit Application</button>
    
    </form>
</body>
</html>
